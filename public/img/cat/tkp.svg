<path class="beat" d="M24 31 l-10 -10 a5.5 5.5 0 0 1 10 -6 a5.5 5.5 0 0 1 10 6z" fill="#ef4444"/></g>
<g fill="#fde68a"><path d="M140 36 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/><circle cx="292" cy="112" r="4"/><circle cx="132" cy="112" r="3"/></g></g></g>
<g fill="#fff"><circle class="spk" cx="40" cy="30" r="2.2"/><circle class="spk" style="animation-delay:.8s" cx="290" cy="130" r="1.8"/><circle class="spk" style="animation-delay:1.6s" cx="70" cy="120" r="1.5"/></g>
</svg>