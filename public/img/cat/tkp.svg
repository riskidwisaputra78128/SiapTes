<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cb382"/><stop offset="1" stop-color="#175f45"/></linearGradient>
<pattern id="d" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".18"/></pattern></defs>
<style>.m{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}.bg1{animation:pz 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pz{50%{transform:scale(1.12)}}.spk{animation:tw 2.4s ease-in-out infinite;opacity:0}@keyframes tw{50%{opacity:.9}}.pulse,.beat,.pop{transform-box:fill-box;transform-origin:center}.flick{transform-box:fill-box;transform-origin:50% 100%}.wave{transform-origin:0 50%}.pulse{animation:pu 1.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.08)}}.flick{animation:fk .5s ease-in-out infinite alternate}@keyframes fk{to{transform:scale(.9,1.1) skewX(4deg)}}.wave{animation:wv 1.6s ease-in-out infinite;transform-box:fill-box}@keyframes wv{50%{transform:skewY(5deg) scaleX(.94)}}.glowc{animation:gl 2s ease-in-out infinite}@keyframes gl{50%{opacity:.45}}.bob2{animation:bb 2.2s ease-in-out infinite;transform-box:fill-box}@keyframes bb{50%{transform:translateY(-6px) rotate(-3deg)}}.beat{animation:bt 1.1s ease-in-out infinite}@keyframes bt{15%,45%{transform:scale(1.25)}30%{transform:scale(1)}}.pop{animation:pp 2.6s ease-in-out infinite}@keyframes pp{50%{transform:scale(1.1) rotate(-4deg)}}.bounce{animation:bo 1.3s cubic-bezier(.3,0,.4,1) infinite}@keyframes bo{50%{transform:translateY(-7px)}}.draw{stroke-dasharray:180;animation:dr 3s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:180}60%,100%{stroke-dashoffset:0}}.sig{animation:sg 1.8s ease-in-out infinite}@keyframes sg{0%,100%{opacity:.25}50%{opacity:1}}.tilt{animation:tl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tl{50%{transform:rotate(6deg) translateY(-3px)}}.twinkle rect{animation:tw2 2.5s steps(2) infinite}.twinkle rect:nth-child(3n){animation-delay:.7s}.twinkle rect:nth-child(4n){animation-delay:1.3s}@keyframes tw2{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="160" fill="url(#g)"/><rect width="320" height="160" fill="url(#d)"/>
<circle cx="36" cy="140" r="70" fill="#fff" opacity=".07"/><circle cx="300" cy="10" r="60" fill="#fff" opacity=".08"/><circle class="bg1" cx="215" cy="80" r="74" fill="#fff" opacity=".08"/>
<g transform="translate(-52 4)"><g class="m">
<g transform="translate(175 60)" fill="#fff"><circle cx="0" cy="0" r="17"/><path d="M-28 70 a28 34 0 0 1 56 0z"/></g>
<g transform="translate(245 66)" fill="#fff" opacity=".85"><circle cx="0" cy="0" r="15"/><path d="M-25 64 a25 30 0 0 1 50 0z"/></g>
