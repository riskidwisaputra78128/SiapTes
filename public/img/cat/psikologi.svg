<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#9d3f6c"/></linearGradient>
<pattern id="d" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".18"/></pattern></defs>
<style>.m{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}.bg1{animation:pz 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pz{50%{transform:scale(1.12)}}.spk{animation:tw 2.4s ease-in-out infinite;opacity:0}@keyframes tw{50%{opacity:.9}}.pc{transform-box:fill-box;transform-origin:center;animation:pp 3s ease-in-out infinite}@keyframes pp{50%{transform:rotate(8deg) scale(1.06)}}.col text{animation:up 3s linear infinite}@keyframes up{to{transform:translateY(-22px)}}.lit{animation:lt 1.2s ease-in-out infinite}@keyframes lt{50%{opacity:.35}}</style>
<rect width="320" height="160" fill="url(#g)"/><rect width="320" height="160" fill="url(#d)"/>
<circle class="bg1" cx="270" cy="30" r="60" fill="#fff" opacity=".08"/><circle class="bg1" cx="40" cy="150" r="50" fill="#fff" opacity=".07" style="animation-delay:-3s"/>
<g class="m">
  <path d="M120 120c-24 0-42-18-42-41 0-24 19-43 44-43 18 0 33 10 39 26 8 2 13 9 12 17l-6 2 4 9c1 4-1 7-5 8l-4 1v9c0 7-6 12-13 12h-29z" fill="#fff" opacity=".95"/>
  <g class="pc"><path d="M108 62h14v-6a7 7 0 1 1 14 0v6h12v14h6a7 7 0 1 1 0 14h-6v14h-40z" fill="#f59e0b"/></g>
  <circle class="lit" cx="150" cy="48" r="3" fill="#fde68a"/>
</g>
<g class="col" font-family="monospace" font-weight="700" font-size="16" fill="#fff" opacity=".9">
  <rect x="214" y="34" width="44" height="96" rx="10" fill="#000" opacity=".18"/>
  <svg x="214" y="34" width="44" height="96"><text x="16" y="24">7</text><text x="16" y="46">8</text><text x="16" y="68" fill="#fde68a">5</text><text x="16" y="90">3</text><text x="16" y="112">9</text><text x="16" y="134">4</text></svg>
</g>
<circle class="spk" cx="60" cy="40" r="3" fill="#fff"/><circle class="spk" cx="190" cy="24" r="2.5" fill="#fff" style="animation-delay:-1.2s"/><circle class="spk" cx="292" cy="120" r="3" fill="#fff" style="animation-delay:-.6s"/>
</svg>
