</g>
<circle cx="208" cy="46" r="7" fill="#fff"/>
<g transform="translate(258 70)"><rect width="40" height="70" rx="8" fill="#fff"/><rect x="5" y="9" width="30" height="48" rx="3" fill="#f795c8"/>
<path d="M12 42 l6 -8 6 5 6 -12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="63" r="3" fill="#c35b92"/></g></g>
<g fill="#fff" opacity=".85"><circle cx="140" cy="70" r="5"/><circle cx="156" cy="110" r="4"/><path d="M140 70 L156 110 L188 118" stroke="#fff" stroke-width="2" fill="none"/></g></g></g>
<g fill="#fff"><circle class="spk" cx="40" cy="30" r="2.2"/><circle class="spk" style="animation-delay:.8s" cx="290" cy="130" r="1.8"/><circle class="spk" style="animation-delay:1.6s" cx="70" cy="120" r="1.5"/></g>
</svg>